<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>دفتر تغذیه</title>
  <meta name="description" content="ثبت روزانه غذا و محاسبه کالری، پروتئین، کربوهیدرات، فیبر و قند">
  <meta name="theme-color" content="#f4f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1412" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="تغذیه">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn" id="prevDay" aria-label="روز قبل">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button class="date-pill" id="dateLabel">امروز</button>
      <button class="icon-btn" id="nextDay" aria-label="روز بعد">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </header>

    <main>
      <!-- ── امروز ── -->
      <section class="view active" id="view-today">
        <div class="card hero">
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 120 120">
              <circle class="ring-bg" cx="60" cy="60" r="52"/>
              <circle class="ring-fg" id="scoreRing" cx="60" cy="60" r="52"/>
            </svg>
            <div class="ring-center">
              <div class="ring-score" id="scoreNum">–</div>
              <div class="ring-label" id="scoreLabel">امتیاز امروز</div>
            </div>
          </div>
          <div class="hero-cal">
            <div class="muted small">کالری</div>
            <div class="cal-big"><span id="calNum">۰</span><span class="cal-target" id="calTarget"> / ۱۸۰۰</span></div>
            <div class="cal-bar"><div class="cal-band" id="calBand"></div><div class="cal-fill" id="calFill"></div></div>
            <div class="small" id="calRemain"></div>
          </div>
        </div>

        <div class="card macros" id="macros"></div>

        <div class="card input-card">
          <div class="meal-tabs" id="mealTabs"></div>
          <textarea id="foodInput" rows="2" placeholder="چی خوردی؟ مثلا: ۵ عدد سفیده تخم مرغ، یک عدد زرده، یک اسکوپ وی، ۸ قاشق برنج (هر خط یا ویرگول = یک غذا)"></textarea>
          <div class="preview" id="preview"></div>
          <div class="input-actions">
            <div class="chips" id="recentChips"></div>
            <button class="btn primary" id="addBtn" disabled>ثبت</button>
          </div>
        </div>

        <div id="mealsList"></div>

        <div class="card insight-card" id="dayInsights"></div>
      </section>

      <!-- ── گزارش ── -->
      <section class="view" id="view-report">
        <div class="segmented" id="periodSeg">
          <button data-period="week" class="on">هفته</button>
          <button data-period="month">ماه</button>
        </div>
        <div class="period-nav">
          <button class="icon-btn" id="prevPeriod" aria-label="قبلی"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
          <div id="periodLabel" class="period-label"></div>
          <button class="icon-btn" id="nextPeriod" aria-label="بعدی"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        </div>
        <div class="card hero report-hero" id="reportHero"></div>
        <div class="card">
          <div class="chips metric-chips" id="metricChips"></div>
          <div id="chart" class="chart"></div>
        </div>
        <div class="stat-grid" id="statGrid"></div>
        <div class="card insight-card" id="reportInsights"></div>
      </section>

      <!-- ── تنظیمات ── -->
      <section class="view" id="view-settings">
        <div class="card">
          <div class="row-between">
            <h3>اهداف روزانه</h3>
            <button class="btn ghost small" id="resetTargets">پیش‌فرض</button>
          </div>
          <div id="targetsForm"></div>
          <p class="muted small" id="fatNote"></p>
        </div>
        <div class="card">
          <h3>مشخصات بدن</h3>
          <p class="small" id="profileLine"></p>
          <button class="btn primary" id="calcBtn" style="width:100%">🧮 محاسبه علمی اهداف بر اساس بدن من</button>
        </div>
        <div class="card">
          <div class="row-between">
            <h3>غذاهای من</h3>
            <button class="btn ghost small" id="addCustomBtn">+ غذای جدید</button>
          </div>
          <div id="customList"></div>
        </div>
        <div class="card">
          <h3>جستجو در غذاها</h3>
          <input type="search" id="foodSearch" placeholder="مثلا: مرغ، ماست، بادام…">
          <div id="foodSearchRes" class="food-search"></div>
        </div>
        <div class="card">
          <h3>پشتیبان‌گیری</h3>
          <p class="muted small">اطلاعات فقط روی همین گوشی ذخیره می‌شود. هر چند وقت یک‌بار فایل پشتیبان بگیر.</p>
          <div class="btn-row">
            <button class="btn" id="exportBtn">ذخیره فایل پشتیبان</button>
            <label class="btn">بازیابی از فایل<input type="file" id="importInput" accept="application/json,.json" hidden></label>
          </div>
          <button class="btn danger-text" id="wipeBtn">پاک کردن همه اطلاعات</button>
        </div>
        <p class="muted small center">مقادیر تغذیه‌ای تقریبی هستند. نسخه ۲</p>
      </section>
    </main>

    <nav class="tabbar">
      <button data-view="today" class="on">
        <svg viewBox="0 0 24 24"><path d="M4 11h16M12 4v16" class="plus"/><rect x="3" y="3" width="18" height="18" rx="6"/></svg>
        <span>امروز</span>
      </button>
      <button data-view="report">
        <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
        <span>گزارش</span>
      </button>
      <button data-view="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>تنظیمات</span>
      </button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-handle"></div><div id="sheetBody"></div></div>
  <div class="toast" id="toast"></div>

  <script src="js/foods.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
